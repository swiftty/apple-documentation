name: test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Make project
        run: make project
      - name: Run tests
        run: make unittest
